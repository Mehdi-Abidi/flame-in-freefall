name: Data checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-checks:
    name: data-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install API and test dependencies
        run: pip install -r requirements.txt httpx

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Rebuild tests.csv from the raw tables
        run: python pipeline/normalize.py

      - name: Rebuild investigations.json from tests.csv and metadata
        run: python pipeline/build_investigations.py

      - name: Merge extracted fields and hand-checked pillars into investigations.json
        run: python pipeline/merge_extraction.py

      - name: Rebuild rankings.json for every habitat
        run: python -m si.rank --write

      - name: Committed data matches the code
        run: |
          if ! git diff --quiet -- data/processed; then
            echo "::error::data/processed is out of date. Run 'python pipeline/normalize.py', 'python pipeline/build_investigations.py', 'python pipeline/merge_extraction.py' and 'python -m si.rank --write', then commit the result."
            git diff --stat -- data/processed
            exit 1
          fi

      - name: Run data QA
        run: python pipeline/qa.py
