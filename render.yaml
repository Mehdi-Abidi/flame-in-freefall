services:
  - type: web
    name: flame-in-freefall-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://mehdi-abidi.github.io,http://localhost:3000"
