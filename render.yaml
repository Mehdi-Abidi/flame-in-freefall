# Render blueprint for the API (task A3). New > Blueprint on render.com, pick this repo.
services:
  - type: web
    name: flame-in-freefall-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_API_KEY
        sync: false   # set it in the Render dashboard, never in Git
      - key: CORS_ORIGINS
        # The live dashboard on GitHub Pages, plus `next dev` for local work on the Ask page.
        value: "https://mehdi-abidi.github.io,http://localhost:3000"
